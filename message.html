@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{--bg:#0b0b10;--surf:rgba(14,14,22,0.82);--card:rgba(255,255,255,0.04);--cardHov:rgba(255,255,255,0.07);--brd:rgba(255,255,255,0.07);--brdH:rgba(255,255,255,0.14);--txt:#e8e6ff;--sub:#9896b8;--muted:#555470;--acc:#7c6aff;--accSoft:rgba(124,106,255,0.18);--accGlow:rgba(124,106,255,0.35);--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--r:10px;--rSm:6px;--ui:'DM Sans',sans-serif;--mono:'DM Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box;}body{user-select:none;overflow:hidden;}
.rm{width:780px;height:530px;background:linear-gradient(145deg,rgba(18,16,30,0.97) 0%,rgba(10,9,18,0.99) 100%);backdrop-filter:blur(32px) saturate(1.4);-webkit-backdrop-filter:blur(32px) saturate(1.4);border:1px solid var(--brd);border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,0.03),0 30px 80px rgba(0,0,0,0.9),inset 0 1px 0 rgba(255,255,255,0.06);display:none;flex-direction:column;overflow:hidden;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:99999;font-family:var(--ui);}

select.rm-select option{background:#13111e;}
select.rm-select:focus{border-color:var(--acc);}
.rm-btn{padding:5px 11px;background:var(--accSoft);border:1px solid rgba(124,106,255,.2);border-radius:var(--rSm);cursor:pointer;color:var(--acc);font-family:var(--ui);font-size:12px;font-weight:600;transition:all .15s;white-space:nowrap;}
.rm-btn:hover{background:rgba(124,106,255,.26);border-color:var(--acc);}
.rm-btn:active{transform:scale(.97);}
.rm-swatch{width:22px;height:22px;border-radius:5px;border:1px solid rgba(255,255,255,0.15);cursor:pointer;transition:border-color .15s,transform .12s;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,0.4);}

.rm-picker{position:fixed;width:230px;padding:13px;background:linear-gradient(145deg,rgba(18,16,30,0.98),rgba(12,11,20,0.99));border:1px solid rgba(255,255,255,0.14);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,0.9),0 0 0 1px rgba(255,255,255,0.03);z-index:100001;backdrop-filter:blur(20px);}

let ACC="#7c6aff";

class MenuUI{
  constructor(u,v){this.tabs=[];this.playerRows=new Map();this.bindings=[];this._groups={};this._init(u,v);}
  _init(u,v){

    this.menu=root;this.sidebar=root.querySelector(".rm-sidebar-inner");this.panelsContainer=root.querySelector(".rm-panels");
    const bar=root.querySelector(".rm-top");let drag=false,ox=0,oy=0;
    bar.addEventListener("mousedown",e=>{if(e.target.closest("button,select,input"))return;drag=true;if(!this._placed){const r=root.getBoundingClientRect();root.style.left=r.left+"px";root.style.top=r.top+"px";root.style.transform="none";this._placed=true;}const r=root.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;});

  _applyScrollFix(el){el.addEventListener("wheel",e=>{const p=el.scrollTop;el.scrollTop+=e.deltaY;if(el.scrollTop!==p){e.preventDefault();e.stopPropagation();}},{passive:false});}
  addTab(label,iconId,groupOrCb,cb){

  addPanelGrid(c){const g=document.createElement("div");g.className="rm-panel-grid";c.appendChild(g);return g;}
  addSection(c,title,iconId){const w2=document.createElement("div");w2.className="rm-section";const card=document.createElement("div");card.className="rm-section-card";const hd=document.createElement("div");hd.className="rm-section-title";hd.innerHTML=(iconId&&ico[iconId]?`${ico[iconId]} `:"")+title;const body=document.createElement("div");body.className="rm-section-body";card.appendChild(hd);card.appendChild(body);w2.appendChild(card);c.appendChild(w2);body._section=w2;return body;}

  _fillSlider(el){const mn=parseFloat(el.min)||0,mx=parseFloat(el.max)||100;const pct=((parseFloat(el.value)-mn)/(mx-mn))*100;el.style.setProperty("background",`linear-gradient(to right,${ACC} 0%,${ACC} ${pct}%,rgba(255,255,255,0.08) ${pct}%,rgba(255,255,255,0.08) 100%)`,"important");}
  addSliderRow(c,label,obj,key,min,max,step){const row=this._row(label);let v=parseFloat(obj[key]);if(isNaN(v))v=min;v=Math.max(min,Math.min(max,v));obj[key]=v;const wrap=document.createElement("div");wrap.className="rm-slider-wrap";const sl=document.createElement("input");sl.type="range";sl.className="rm-range";sl.min=min;sl.max=max;sl.step=step;sl.value=v;const val=document.createElement("span");val.className="rm-range-val";val.textContent=v;this._fillSlider(sl);requestAnimationFrame(()=>this._fillSlider(sl));sl.addEventListener("input",e=>{const n=parseFloat(e.target.value);obj[key]=n;val.textContent=n;this._fillSlider(sl);});wrap.appendChild(sl);wrap.appendChild(val);row.appendChild(wrap);c.appendChild(row);return row;}
  addSelectRow(c,label,options,obj,key){const row=this._row(label);const sel=document.createElement("select");sel.className="rm-select";options.forEach(o=>{const opt=document.createElement("option");opt.value=o;opt.textContent=o;if(obj[key]===o)opt.selected=true;sel.appendChild(opt);});sel.addEventListener("change",e=>{obj[key]=e.target.value;});this.bindings.push(()=>{sel.value=obj[key];});row.appendChild(sel);c.appendChild(row);return row;}
  addTextRow(c,label,obj,key,ph){const row=this._row(label);const inp=document.createElement("input");inp.type="text";inp.className="rm-textinput";inp.value=obj[key]||"";inp.placeholder=ph||"";inp.addEventListener("input",e=>{obj[key]=e.target.value;});["keydown","keypress","keyup"].forEach(ev=>inp.addEventListener(ev,e=>e.stopImmediatePropagation()));inp.addEventListener("pointerdown",e=>e.stopImmediatePropagation());this.bindings.push(()=>{inp.value=obj[key]||"";});row.appendChild(inp);c.appendChild(row);return row;}
  addButton(c,label,obj,key,cb){const row=this._row(label);const btn=document.createElement("div");btn.className="rm-btn";btn.textContent=(obj&&obj[key])||label;btn.addEventListener("click",()=>{if(cb)cb(obj,key,btn);});row.appendChild(btn);c.appendChild(row);return row;}

  addColorRow(c,label,obj,key){
    const row=this._row(label);
    const sw=document.createElement("div");sw.className="rm-swatch";
    const refresh=()=>{const col=obj[key];sw.style.background=(col&&typeof col==="object"&&col.h!==undefined)?`hsl(${col.h},${col.s}%,${col.l}%)`:(typeof col==="string"?col:"#ffffff");};
    refresh();this.bindings.push(refresh);
    sw.addEventListener("click",()=>this.openColorPicker(sw,obj,key,obj[key]??getComputedStyle(sw).backgroundColor,col=>{sw.style.background=col;}));
    row.appendChild(sw);c.appendChild(row);return row;
  }

  openColorPicker(triggerEl,obj,key,initialColor,onChange){
    document.querySelectorAll(".rm-picker").forEach(el=>el.remove());
    const PW=206,PH=130;
    const popup=document.createElement("div");popup.className="rm-picker";
    const cvs=document.createElement("canvas");cvs.width=PW;cvs.height=PH;cvs.style.cssText=`width:${PW}px;height:${PH}px;`;popup.appendChild(cvs);
    const ctx2=cvs.getContext("2d");
    const hueTrack=document.createElement("div");hueTrack.className="rm-picker-track";hueTrack.style.background="linear-gradient(to right,red,yellow,lime,cyan,blue,magenta,red)";const hueThumb=document.createElement("div");hueThumb.className="rm-picker-thumb";hueTrack.appendChild(hueThumb);popup.appendChild(hueTrack);
    const alphaTrack=document.createElement("div");alphaTrack.className="rm-picker-track";const alphaThumb=document.createElement("div");alphaThumb.className="rm-picker-thumb";alphaTrack.appendChild(alphaThumb);popup.appendChild(alphaTrack);
    const preview=document.createElement("div");preview.className="rm-picker-preview";popup.appendChild(preview);
    const hexInput=document.createElement("input");hexInput.className="rm-picker-hex";hexInput.placeholder="#rrggbbaa";popup.appendChild(hexInput);
    document.body.appendChild(popup);
    const tr=triggerEl.getBoundingClientRect();let top=tr.bottom+6,left=tr.left;
    const pw=popup.offsetWidth,ph2=popup.offsetHeight;
    if(left+pw>window.innerWidth-8)left=window.innerWidth-pw-8;
    if(top+ph2>window.innerHeight-8)top=tr.top-ph2-6;
    popup.style.top=top+"px";popup.style.left=left+"px";

    let hue=0,sat=1,bri=1,alpha=1,cursorX=PW,cursorY=0;

    function rgbaToHex(r,g,b,a){const h=n=>n.toString(16).padStart(2,"0");return"#"+h(r)+h(g)+h(b)+(a<1?h(Math.round(a*255)):"");}
    function parseColor(str){const t2=document.createElement("canvas");t2.width=t2.height=1;const ct=t2.getContext("2d");ct.fillStyle=(str&&str!=="none")?str:"#ffffff";ct.fillRect(0,0,1,1);const[r,g,b,a]=ct.getImageData(0,0,1,1).data;return{r,g,b,a:a/255};}
    function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){switch(mx){case r:h=((g-b)/d+(g<b?6:0))*60;break;case g:h=((b-r)/d+2)*60;break;case b:h=((r-g)/d+4)*60;break;}}return{h,s:mx?d/mx:0,v:mx};}
    function getRgb(h,s,v){const f=(n,k=(n+h/60)%6)=>v-v*s*Math.max(Math.min(k,4-k,1),0);return[Math.round(f(5)*255),Math.round(f(3)*255),Math.round(f(1)*255)];}

    function drawCanvas(){
      ctx2.fillStyle=`hsl(${hue},100%,50%)`;ctx2.fillRect(0,0,PW,PH);
      const gW=ctx2.createLinearGradient(0,0,PW,0);gW.addColorStop(0,"rgba(255,255,255,1)");gW.addColorStop(1,"rgba(255,255,255,0)");ctx2.fillStyle=gW;ctx2.fillRect(0,0,PW,PH);
      const gB=ctx2.createLinearGradient(0,0,0,PH);gB.addColorStop(0,"rgba(0,0,0,0)");gB.addColorStop(1,"rgba(0,0,0,1)");ctx2.fillStyle=gB;ctx2.fillRect(0,0,PW,PH);
      ctx2.strokeStyle="#fff";ctx2.lineWidth=1.5;ctx2.beginPath();ctx2.arc(cursorX,cursorY,5,0,Math.PI*2);ctx2.stroke();
      ctx2.strokeStyle="rgba(0,0,0,0.4)";ctx2.lineWidth=1;ctx2.beginPath();ctx2.arc(cursorX,cursorY,6.5,0,Math.PI*2);ctx2.stroke();
    }

    function commit(){
      const[r,g,b]=getRgb(hue,sat,bri);
      const rgba=`rgba(${r},${g},${b},${alpha.toFixed(3)})`;
      obj[key]=rgba;
      triggerEl.style.background=rgba;
      preview.style.background=rgba;
      alphaTrack.style.background=`linear-gradient(to right,rgba(${r},${g},${b},0),rgba(${r},${g},${b},1))`;
      hexInput.value=rgbaToHex(r,g,b,alpha);
      if(typeof onChange==="function")onChange(rgba);
    }

    function setHueThumb(h){hueThumb.style.left=(h/360)*hueTrack.offsetWidth+"px";}
    function setAlphaThumb(a){alphaThumb.style.left=a*alphaTrack.offsetWidth+"px";}
    function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

    function bindDrag(el,onMove){
      el.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();el.setPointerCapture(e.pointerId);onMove(e);const mm=e2=>{if(e2.buttons)onMove(e2);};el.addEventListener("pointermove",mm);el.addEventListener("pointerup",()=>el.removeEventListener("pointermove",mm),{once:true});});
    }

    bindDrag(cvs,e=>{const r=cvs.getBoundingClientRect();cursorX=clamp(e.clientX-r.left,0,PW);cursorY=clamp(e.clientY-r.top,0,PH);sat=cursorX/PW;bri=1-cursorY/PH;drawCanvas();commit();});
    bindDrag(hueTrack,e=>{const r=hueTrack.getBoundingClientRect();hue=clamp((e.clientX-r.left)/r.width,0,1)*360;setHueThumb(hue);drawCanvas();commit();});
    bindDrag(alphaTrack,e=>{const r=alphaTrack.getBoundingClientRect();alpha=clamp((e.clientX-r.left)/r.width,0,1);setAlphaThumb(alpha);commit();});
    hexInput.addEventListener("change",()=>{const{r,g,b,a}=parseColor(hexInput.value);alpha=a;const hsv=rgbToHsv(r,g,b);hue=hsv.h;sat=hsv.s;bri=hsv.v;cursorX=sat*PW;cursorY=(1-bri)*PH;setHueThumb(hue);setAlphaThumb(alpha);drawCanvas();commit();});

    (function init(){const{r,g,b,a}=parseColor(initialColor||"#ff0000");alpha=a;const hsv=rgbToHsv(r,g,b);hue=hsv.h;sat=hsv.s;bri=hsv.v;cursorX=sat*PW;cursorY=(1-bri)*PH;setHueThumb(hue);setAlphaThumb(alpha);drawCanvas();commit();})();

    setTimeout(()=>{document.addEventListener("mousedown",function outside(e){if(!popup.contains(e.target)&&e.target!==triggerEl){popup.remove();document.removeEventListener("mousedown",outside);}});},0);
  }
}
